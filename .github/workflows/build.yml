name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build OutSmart.DAXon.sln -c Release

      - name: Smoke test
        shell: bash
        run: |
          dotnet run --project tests/Smoke/Smoke.csproj -c Release -p:SmokeTargetFramework=net472 \
            -p:DaxonDll="$GITHUB_WORKSPACE/src/OutSmart.DAXon/bin/Release/net472/OutSmart.DAXon.dll"

      - name: Smoke test (net10.0)
        shell: bash
        run: |
          dotnet run --project tests/Smoke/Smoke.csproj -c Release -p:SmokeTargetFramework=net10.0 \
            -p:DaxonDll="$GITHUB_WORKSPACE/src/OutSmart.DAXon/bin/Release/net10.0/OutSmart.DAXon.dll"

      - name: Smoke test (net8.0)
        shell: bash
        run: |
          dotnet run --project tests/Smoke/Smoke.csproj -c Release -p:SmokeTargetFramework=net8.0 \
            -p:DaxonDll="$GITHUB_WORKSPACE/src/OutSmart.DAXon/bin/Release/net8.0/OutSmart.DAXon.dll"

      - name: Upload assembly
        uses: actions/upload-artifact@v4
        with:
          name: OutSmart.DAXon-net472
          path: src/OutSmart.DAXon/bin/Release/net472/OutSmart.DAXon.dll
          if-no-files-found: error

      - name: Upload assembly (net10.0)
        uses: actions/upload-artifact@v4
        with:
          name: OutSmart.DAXon-net10.0
          path: src/OutSmart.DAXon/bin/Release/net10.0/OutSmart.DAXon.dll
          if-no-files-found: error

      - name: Upload assembly (net8.0)
        uses: actions/upload-artifact@v4
        with:
          name: OutSmart.DAXon-net8.0
          path: src/OutSmart.DAXon/bin/Release/net8.0/OutSmart.DAXon.dll
          if-no-files-found: error

  # .NET assemblies only: proves they load and transform on Linux (no kernel32, code pages
  # registered, first stack probe survives). Not a corpus run - ICU tables differ by OS.
  smoke-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build (.NET targets only)
        run: |
          dotnet build src/OutSmart.DAXon -c Release -f net8.0
          dotnet build src/OutSmart.DAXon -c Release -f net10.0

      - name: Smoke test (net8.0)
        run: |
          dotnet run --project tests/Smoke/Smoke.csproj -c Release -p:SmokeTargetFramework=net8.0 \
            -p:DaxonDll="$GITHUB_WORKSPACE/src/OutSmart.DAXon/bin/Release/net8.0/OutSmart.DAXon.dll"

      - name: Smoke test (net10.0)
        run: |
          dotnet run --project tests/Smoke/Smoke.csproj -c Release -p:SmokeTargetFramework=net10.0 \
            -p:DaxonDll="$GITHUB_WORKSPACE/src/OutSmart.DAXon/bin/Release/net10.0/OutSmart.DAXon.dll"
